name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: niceotp
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: niceotp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U niceotp -d niceotp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config postgresql-client
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --workspace
      - run: python3 -m pip install --break-system-packages 'cryptography>=44,<50'
      - run: python3 scripts/e2e.py
        env:
          TEST_DATABASE_URL: postgres://niceotp:test-only@127.0.0.1:5432/niceotp_test
      - run: docker compose -f deploy/compose.local.yml up -d dex
      - run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5556/dex/.well-known/openid-configuration > /dev/null && break
            sleep 1
          done
          python3 scripts/dex_smoke.py
        env:
          TEST_DATABASE_URL: postgres://niceotp:test-only@127.0.0.1:5432/niceotp_test
      - if: always() && hashFiles('deploy/compose.local.yml') != ''
        run: docker compose -f deploy/compose.local.yml down
  cli:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p niceotp-cli -p niceotp-vault
      - run: cargo build --locked --release -p niceotp-cli
      - uses: actions/upload-artifact@v4
        with:
          name: niceotp-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/niceotp
            LICENSE
            NOTICE
            THIRD_PARTY_LICENSES.txt
